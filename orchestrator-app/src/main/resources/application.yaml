server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: orchestrator-app
  # Local runs pick up the repo-root .env (git-ignored). Real environment variables take precedence.
  config:
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORCH_POSTGRES_URL:jdbc:postgresql://localhost:5434/orchestrator}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true

# Paths are relative to the working directory (orchestrator-app/ under spring-boot:run).
orchestrator:
  config-dir: ${ORCH_CONFIG_DIR:../config}
  scenarios-dir: ${ORCH_SCENARIOS_DIR:../scenarios}
  data-dir: ${ORCH_DATA_DIR:../.orchestrator}
  workspace-root: ${ORCH_WORKSPACE_ROOT:../.agent-worktrees}
  # What runs clone and publish to: a bare or remote repository (publish refuses a working copy).
  source-repo: ${ORCH_SOURCE_REPO:..}
  base-branch: ${ORCH_BASE_BRANCH:main}
  recover-on-startup: true
  safe-stop-grace: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
