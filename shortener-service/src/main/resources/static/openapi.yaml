openapi: 3.1.0
info:
  title: URL Shortener API
  description: Short links with analytics. Errors are RFC 9457 Problem Details.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Links
  description: "Create, inspect and delete short links"
paths:
  /api/v1/links:
    post:
      tags:
      - Links
      summary: Create a short link
      description: "Send Idempotency-Key to make retries safe: the same key and body\
        \ replay the stored response (header Idempotent-Replayed: true); the same\
        \ key with a different body returns 422. Keys are kept for 24h."
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkResponse"
      security:
      - apiKey: []
  /{code}:
    get:
      tags:
      - Redirect
      summary: Redirect to the original URL
      operationId: redirect
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/links/{code}:
    get:
      tags:
      - Links
      summary: Get link metadata (deleted links are returned with status DELETED)
      operationId: get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkResponse"
      security:
      - apiKey: []
    delete:
      tags:
      - Links
      summary: Soft-delete a link (idempotent)
      operationId: delete
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      security:
      - apiKey: []
  /api/v1/links/{code}/stats:
    get:
      tags:
      - Links
      summary: Click stats for a link
      description: "Days are UTC, both ends inclusive; the default is the last 30\
        \ days, the maximum 90. Clicks appear about a second after the redirect. uniqueVisitors\
        \ is approximate (HyperLogLog), and a visitor seen on two days counts twice."
      operationId: stats
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkStats"
      security:
      - apiKey: []
components:
  schemas:
    CreateLinkRequest:
      type: object
      properties:
        url:
          type: string
          example: https://example.com/some/very/long/path
          minLength: 1
        customAlias:
          type:
          - string
          - "null"
          description: "Optional. 4-32 chars of letters, digits, '_' or '-'."
          example: promo-2026
      required:
      - url
    LinkResponse:
      type: object
      properties:
        code:
          type: string
        shortUrl:
          type: string
        originalUrl:
          type: string
        customAlias:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DayClicks:
      type: object
      properties:
        day:
          type: string
          format: date
        clicks:
          type: integer
          format: int64
    LinkStats:
      type: object
      properties:
        code:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalClicks:
          type: integer
          format: int64
        uniqueVisitors:
          type: integer
          format: int64
        clicksByDay:
          type: array
          items:
            $ref: "#/components/schemas/DayClicks"
        topReferrers:
          type: array
          items:
            $ref: "#/components/schemas/ReferrerClicks"
        byUaFamily:
          type: object
          additionalProperties:
            type: integer
            format: int64
    ReferrerClicks:
      type: object
      properties:
        host:
          type: string
        clicks:
          type: integer
          format: int64
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
