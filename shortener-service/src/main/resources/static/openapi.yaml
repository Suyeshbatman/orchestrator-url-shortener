openapi: 3.1.0
info:
  title: URL Shortener API
  description: Short links with analytics. Errors are RFC 9457 Problem Details.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Links
  description: "Create, inspect and delete short links"
paths:
  /api/v1/links:
    post:
      tags:
      - Links
      summary: Create a short link
      description: "Send Idempotency-Key to make retries safe: the same key and body\
        \ replay the stored response (header Idempotent-Replayed: true); the same\
        \ key with a different body returns 422. Keys are kept for 24h."
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkResponse"
      security:
      - apiKey: []
  /{code}:
    get:
      tags:
      - Redirect
      summary: Redirect to the original URL
      operationId: redirect
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/links/{code}:
    get:
      tags:
      - Links
      summary: Get link metadata (deleted links are returned with status DELETED)
      operationId: get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkResponse"
      security:
      - apiKey: []
    delete:
      tags:
      - Links
      summary: Soft-delete a link (idempotent)
      operationId: delete
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      security:
      - apiKey: []
components:
  schemas:
    CreateLinkRequest:
      type: object
      properties:
        url:
          type: string
          example: https://example.com/some/very/long/path
          minLength: 1
        customAlias:
          type:
          - string
          - "null"
          description: "Optional. 4-32 chars of letters, digits, '_' or '-'."
          example: promo-2026
      required:
      - url
    LinkResponse:
      type: object
      properties:
        code:
          type: string
        shortUrl:
          type: string
        originalUrl:
          type: string
        customAlias:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
