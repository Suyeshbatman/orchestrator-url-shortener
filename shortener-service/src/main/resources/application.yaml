server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: shortener-service
  # Local runs pick up the repo-root .env (git-ignored). Real environment variables take precedence.
  config:
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5434/shortener}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 2000
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8085}
  # name:sha256hex(key), comma-separated. Empty = every /api request gets 401.
  api-keys: ${SHORTENER_API_KEYS:}
  redirect:
    status: 302
  cache:
    l1-max-size: 10000
    l1-ttl: 5m
    l2-ttl: 24h
    negative-ttl: 60s
    redis-breaker:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
  idempotency:
    ttl: 24h
  # Token buckets (DESIGN_RATIONALE §3.4, §5). Create: per API key; redirect: per visitor.
  rate-limit:
    enabled: true
    create-capacity: 60
    create-period: 1m
    redirect-capacity: 600
    redirect-period: 1m
    local-max-keys: 10000
  # Clicks: bounded queue → batched writer (ADR-0004). Stats lag by about one flush interval.
  analytics:
    queue-capacity: 10000
    batch-size: 500
    flush-interval: 1s
    hll-ttl: 400d
    max-range-days: 90
  url:
    max-length: 2048
    allowed-schemes: [http, https]
    block-private-networks: true
    dns-timeout: 500ms
  code:
    length: 7
    # Required, 32+ characters. Never commit a real value.
    secret: ${SHORTENER_CODE_SECRET:}
    feistel-rounds: 4
  alias:
    min: 4
    max: 32
    pattern: "^[A-Za-z0-9_-]+$"
    reserved: [api, actuator, admin, health, swagger-ui]
